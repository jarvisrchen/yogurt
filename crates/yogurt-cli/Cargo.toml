[package]
name = "yogurt"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
categories.workspace = true
keywords.workspace = true

[[bin]]
name = "yogurt"
path = "src/main.rs"

[dependencies]
tokio = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
yogurt-server = { path = "../yogurt-server", version = "0.1.0" }
open = "5"
# Phase 5 (Plan 05-02): .env.local dev-mode loader. Gated on the `--dev`
# flag at the top of main() — release builds NEVER read .env.local
# (SET-11). See main.rs and tests/dev_env_local.rs.
dotenvy = { workspace = true }

[dev-dependencies]
assert_cmd = { workspace = true }
reqwest = { workspace = true }
# SET-12 follow-up: cli tests redirect HOME to a tempdir so spawned
# subprocesses don't touch the developer's real ~/.yogurt/db.sqlite.
tempfile = { workspace = true }
