[package]
name = "yogurt"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
categories.workspace = true
keywords.workspace = true

[[bin]]
name = "yogurt"
path = "src/main.rs"

[dependencies]
tokio = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
# No `version =` on this path dep on purpose. It would have to be bumped by
# hand every release, and forgetting breaks `cargo update --workspace` with
# "failed to select a version for the requirement yogurt-server". A version
# is only required here to publish to crates.io, which is descoped (see the
# note at the bottom of .github/workflows/release.yml). Restore it if that
# ever comes back.
yogurt-server = { path = "../yogurt-server" }
open = "5"
# Phase 5 (Plan 05-02): .env.local dev-mode loader. Gated on the `--dev`
# flag at the top of main() — release builds NEVER read .env.local
# (SET-11). See main.rs and tests/dev_env_local.rs.
dotenvy = { workspace = true }
# Phase 9 (Plan 09-03): `yogurt doctor` reads provider names + active STT
# from the real SQLite settings store, and screen-recording permission
# from the real TCC check. Both crates are already in the dependency
# graph via yogurt-server, so this adds no new linkage.
yogurt-db = { path = "../yogurt-db" }
yogurt-audio = { path = "../yogurt-audio" }
# Same `directories` crate yogurt-db/yogurt-stt use for `~/.yogurt`
# resolution (do NOT use the unmaintained `dirs` crate).
directories = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
assert_cmd = { workspace = true }
reqwest = { workspace = true }
# SET-12 follow-up: cli tests redirect HOME to a tempdir so spawned
# subprocesses don't touch the developer's real ~/.yogurt/db.sqlite.
tempfile = { workspace = true }
