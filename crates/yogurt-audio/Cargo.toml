[package]
name = "yogurt-audio"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "macOS audio capture (mic + system loopback) for yogurt — 16 kHz mono i16."

[dependencies]
tokio = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
cpal = { workspace = true }
rubato = { workspace = true }
rtrb = { workspace = true }
parking_lot = { workspace = true }

# screencapturekit is gated to macOS because the crate links the Swift bridge
# against the macOS-only ScreenCaptureKit.framework.
[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
tracing-subscriber = { workspace = true }
# WAV writer for the 30-second dual-channel ear-test acceptance gate
# (Phase 2 success criterion #1 — `examples/wav_eartest.rs`).
hound = "3.5"

[features]
default = []
# Enable the synthetic sine-wave generator outside of `cargo test`.
# Phase 5 settings may surface this as a debug-input source.
synthetic = []

# tests/synthetic.rs reaches into the synthetic module via the public API; the
# integration-test crate does not inherit the lib's `cfg(test)` gate, so it
# needs the feature explicitly. (Phase 3 deferred D-INT-01.)
[[test]]
name = "synthetic"
required-features = ["synthetic"]
