[package]
name = "yogurt-db"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Yogurt SQLite (providers + settings) + API-key file store"

[dependencies]
rusqlite = { workspace = true }
rusqlite_migration = { workspace = true }
directories = { workspace = true }
ulid = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
# Phase 7 (Plan 07-01): MeetingRepo timestamps (created_at, updated_at)
# travel over the wire as ISO 8601 strings via serde. `chrono` with the
# `serde` feature gives us `DateTime<Utc>` serialization for free without
# pulling in the heavier `time` crate's serde adapters.
chrono = { workspace = true, features = ["serde"] }
