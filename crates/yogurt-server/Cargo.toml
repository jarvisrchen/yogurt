[package]
name = "yogurt-server"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
tokio = { workspace = true }
axum = { workspace = true, features = ["macros", "ws"] }
tower = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rust-embed = { workspace = true }
reqwest = { workspace = true }
mime_guess = { workspace = true }
rusqlite = { workspace = true }
directories = { workspace = true }
rand = { workspace = true }
base64 = { workspace = true }
subtle = { workspace = true }
yogurt-audio = { path = "../yogurt-audio" }
yogurt-stt = { path = "../yogurt-stt" }
# Phase 5 (Plan 05-01): LlmClient trait + OpenAI-compat adapter. The
# enhance handler talks to providers through `LlmClient`; Phase 6 chat
# will share the same crate without going through axum.
yogurt-llm = { path = "../yogurt-llm" }
# Phase 5 (Plan 05-01): `MockLlm::stream` returns a `BoxStream` so the
# server crate needs `futures_util` in main deps (also in dev-deps for
# integration tests).
futures-util = { workspace = true }
# Phase 5 (Plan 05-02): providers + settings + Keychain. `Db` and
# `ApiKeyStore` are carried on `AppState` for handlers + bootstrap.
yogurt-db = { path = "../yogurt-db" }
uuid = { workspace = true }
async-trait = { workspace = true }
# Phase 4 (Plan 04-02): date formatting for MarkdownExporter filenames.
time = { workspace = true }
# Phase 4 (Plan 04-03): the enhance handler consumes both Phase 4 crates.
yogurt-prompts = { path = "../yogurt-prompts" }
yogurt-notes = { path = "../yogurt-notes" }
# BL-2 (Phase 4 review): server-side HTML sanitization for enriched_md before
# it's persisted + sent to the browser. The LLM can hallucinate <script>
# tags + onerror handlers; ammonia's allowlist keeps only the wire-format
# spans (data-ai-grey, data-transcript-link).
ammonia = { workspace = true }
html-escape = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
reqwest = { workspace = true }
tempfile = { workspace = true }
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }
