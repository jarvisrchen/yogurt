[package]
name = "yogurt-server"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
tokio = { workspace = true }
axum = { workspace = true, features = ["macros", "ws"] }
tracing = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rust-embed = { workspace = true }
reqwest = { workspace = true }
rusqlite = { workspace = true }
directories = { workspace = true }
rand = { workspace = true }
base64 = { workspace = true }
subtle = { workspace = true }
yogurt-audio = { path = "../yogurt-audio" }
# REST handlers call `yogurt_stt::models::*` and `meetings/start.rs` constructs
# `WhisperLocal`, so the local path is always on for the server.
yogurt-stt = { path = "../yogurt-stt", features = ["local-stt"] }
yogurt-llm = { path = "../yogurt-llm" }
# `MockLlm::stream` returns a `BoxStream`, so this is a main dependency.
futures-util = { workspace = true }
yogurt-db = { path = "../yogurt-db" }
yogurt-cloud = { path = "../yogurt-cloud" }
yogurt-granola = { path = "../yogurt-granola" }
uuid = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
yogurt-prompts = { path = "../yogurt-prompts" }
yogurt-notes = { path = "../yogurt-notes" }
# Sanitizes enriched_md before it is persisted and sent to the browser. The
# allowlist keeps only the wire-format spans (data-ai-grey, data-transcript-link).
ammonia = { workspace = true }
html-escape = { workspace = true }
# Tempdir for the test_support module. Release builds never link it.
tempfile = { workspace = true, optional = true }

[features]
# Exposes `test_support::{MockChunksLlm, run_with_mock_llm, seed_meeting}` to
# integration tests. Release builds never compile the helpers.
test-support = ["dep:tempfile"]

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
reqwest = { workspace = true }
tempfile = { workspace = true }
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }
wiremock = { workspace = true }
yogurt-server = { path = ".", features = ["test-support"] }
