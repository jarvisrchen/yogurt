[workspace]
resolver = "2"
members = [
    "crates/yogurt-cli",
    "crates/yogurt-server",
    "crates/yogurt-audio",
    "crates/yogurt-stt",
    "crates/yogurt-prompts",
    "crates/yogurt-notes",
    "crates/yogurt-llm",
    "crates/yogurt-db",
    "crates/yogurt-cloud",
]

[workspace.package]
version = "1.6.0"
edition = "2021"
authors = ["Jarvis Chen <3chenr@gmail.com>"]
license = "MIT"
repository = "https://github.com/jarvisrchen/yogurt"
rust-version = "1.96"
description = "Local-first meeting copilot - Granola's UX, your machine."
homepage = "https://github.com/jarvisrchen/yogurt"
documentation = "https://github.com/jarvisrchen/yogurt#readme"
readme = "README.md"
categories = ["command-line-utilities", "multimedia::audio"]
keywords = ["meeting", "transcription", "notes", "local-first", "granola"]

[workspace.dependencies]
tokio = { version = "1.42", features = ["full"] }
axum = { version = "0.8", features = ["macros"] }
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rust-embed = { version = "8.5", features = ["mime-guess"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rusqlite = { version = "0.32", features = ["bundled"] }
rusqlite_migration = "1"
ulid = { version = "1", features = ["serde"] }
# Gated behind `--dev` in yogurt-cli main(). Release builds never read .env.local.
dotenvy = "0.15"
directories = "5"
rand = "0.8"
base64 = "0.22"
subtle = "2"
assert_cmd = "2"
tempfile = "3"
# rustls-tls-webpki-roots avoids an OpenSSL link (single-binary distribution
# needs no system OpenSSL). Do NOT enable the default native-tls feature.
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
# `sink` for SinkExt (write half of split WS), `std` for tokio compatibility.
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
async-trait = "0.1"
uuid = { version = "1", features = ["v7", "serde"] }
cpal = "0.15"
# Pinned to 8 with macos_13_0 (audio capture surface); 0.3 had a different builder API.
screencapturekit = { version = "8", features = ["macos_13_0"] }
rubato = "0.16"
# Lock-free SPSC ring buffer that decouples real-time audio callbacks (cpal
# IOProc, SCK delegate) from the tokio drainer task that owns rubato.
rtrb = "0.3"
# Non-poisoning mutex around the SPSC producer in the SCK audio handler, whose
# trait bound demands `Fn + Send + Sync`.
parking_lot = "0.12"
thiserror = "2"
tinytemplate = "1.2"
pulldown-cmark = { version = "0.12", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
eventsource-stream = "0.2"
wiremock = "0.6"
# html-escape escapes user text before it is interpolated into wire-format
# spans. ammonia allowlist-sanitizes the final enriched_md so an LLM
# hallucinated <script> or <img onerror=...> never reaches the browser DOM.
html-escape = "0.2"
ammonia = "4"
# `default-features = false` lets yogurt-stt opt into Metal explicitly, so
# consumers without `local-stt` never pull in the whisper.cpp CMake build.
whisper-rs = { version = "0.16", default-features = false }
webrtc-vad = "0.4"
sha2 = "0.10"
# Sync crypto: ECDH P-256 + HKDF + AES-256-GCM, with the key wrapped by PBKDF2.
p256 = { version = "0.13", features = ["ecdh", "pkcs8"] }
hkdf = "0.12"
aes-gcm = "0.10"
pbkdf2 = "0.12"
unicode-normalization = "0.1"
zeroize = "1"
url = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

# PBKDF2 at 600,000 iterations takes seconds with an unoptimized SHA-256 compress function.
[profile.dev.package.sha2]
opt-level = 3
