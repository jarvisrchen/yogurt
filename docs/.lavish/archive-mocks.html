<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Archive mocks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.11"></script>
<!-- Tokens copied from web/src/index.css. cloud/src/index.css imports the same file, so the webapp shares them. -->
<style type="text/tailwindcss">
@theme {
  --color-paper:   #FBF7EF;  /* app background, hero surfaces             */
  --color-card:    #FFFFFF;  /* cards, surfaces over paper                */
  --color-ink:     #211D18;  /* user notes, headings, primary text        */
  --color-grey:    #A89F90;  /* secondary captions, transcript "Them"     */
  --color-ai:      #7A7264;  /* AI-added text (4.5:1 on paper)            */
  --color-line:    #EBE3D5;  /* borders, dividers                         */
  --color-blue:    #5B4FC7;  /* primary blueberry: buttons, transcript   */
  --color-blsoft:  #ECE9FB;  /* soft blueberry: active-nav, pill bg      */
  --color-straw:   #E07A66;  /* recording indicator, error accent         */
  --color-strsoft: #FBE6E0;  /* soft strawberry: error/warning bg        */
  --color-matcha:  #5E9E73;  /* local-only / privacy / success            */
  --color-mtsoft:  #E7F0E8;  /* soft matcha: local-mode badges           */
  --color-mut:     #8A8174;  /* muted text on cards                       */
  /* Label chip palette (LabelChip.tsx): the three non-brand label colors. */
  --color-lilac:     #8A5BB8;
  --color-lilacsoft: #F3E8FB;
  --color-honey:     #A67C1B;
  --color-honeysoft: #FBF0D6;
  --color-honeyink:  #7A5A0F;  /* honey text that reaches 4.5:1 on white and on honeysoft */
  --color-slate:     #4E5D6B;
  --color-slatesoft: #E8ECF0;

  --font-sans:  "Manrope", "Inter", "DM Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono:  "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;

  --radius-chip:   8px;    /* small chip                                    */
  --radius-button: 12px;   /* buttons, inputs, nav rows                     */
  --radius-card:   16px;   /* cards                                         */
  --radius-panel:  24px;   /* floating panels: chat window, dialogs, dock   */
  --radius-pill:   999px;  /* pills, recording badge                        */

  /* Tailwind copies a shadow's value into its utility class, so dark mode re-points the colors below, not these. */
  --shadow-card:   0 16px 32px -4px var(--shadow-card-color);
  --shadow-pop:    0 12px 16px -4px var(--shadow-pop-color);
  --shadow-window: 0 24px 48px -8px var(--shadow-window-color);
  --shadow-button-blue: 0 8px 16px -6px rgba(91, 79, 199, 0.35);
}

/* The label palette is read from inline styles (LabelChip), which the runtime does not scan, so emit every token. */
:root {
  color-scheme: light;
  --shadow-card-color:   rgba(33, 29, 24, 0.06);
  --shadow-pop-color:    rgba(33, 29, 24, 0.18);
  --shadow-window-color: rgba(33, 29, 24, 0.22);
  --color-lilac:     #8A5BB8;
  --color-lilacsoft: #F3E8FB;
  --color-honey:     #A67C1B;
  --color-honeysoft: #FBF0D6;
  --color-slate:     #4E5D6B;
  --color-slatesoft: #E8ECF0;
}

/* The app stamps data-theme="dark" on <html>. A mock forces dark on its own frame with .force-dark. */
:root[data-theme="dark"], .force-dark {
  color-scheme: dark;
  --color-paper:   #1B1815;
  --color-card:    #26221D;
  --color-ink:     #EDEAE2;
  --color-grey:    #8F877B;
  --color-ai:      #A69D90;
  --color-line:    #3A342C;
  --color-blue:    #7D72DE;
  --color-blsoft:  #2C2846;
  --color-straw:   #E8886F;
  --color-strsoft: #3D2622;
  --color-matcha:  #7FBE8C;
  --color-mtsoft:  #22342A;
  --color-mut:     #9B9285;
  --color-lilac:     #C4A2E8;
  --color-lilacsoft: #33283F;
  --color-honey:     #D9B24E;
  --color-honeysoft: #3A3120;
  --color-honeyink:  #D9B24E;
  --color-slate:     #A9B7C4;
  --color-slatesoft: #2A3138;
  --shadow-card-color:   rgba(0, 0, 0, 0.35);
  --shadow-pop-color:    rgba(0, 0, 0, 0.5);
  --shadow-window-color: rgba(0, 0, 0, 0.6);
}

@utility heading-hero    { @apply font-extrabold tracking-[-0.01em] text-[44px] leading-none text-ink; }
@utility heading-greeting{ @apply font-extrabold tracking-[-0.01em] text-[34px] leading-tight text-ink; }
@utility heading-title   { @apply font-extrabold tracking-[-0.01em] text-[26px] leading-none text-ink; }
@utility heading-state   { @apply font-extrabold tracking-[-0.01em] text-[30px] text-ink; }
@utility heading-section { @apply font-extrabold tracking-[-0.01em] text-[24px] leading-none text-ink; }
@utility heading-wordmark{ @apply font-bold tracking-[-0.01em] text-[20px] leading-none text-ink; }
@utility heading-card    { @apply font-bold tracking-[-0.01em] text-[18px] leading-tight text-ink; }
@utility heading-sm      { @apply font-sans font-bold tracking-[-0.01em] text-[16px] text-ink; }

html, body {
  margin: 0;
  background: var(--color-paper);
  color: var(--color-ink);
  font-family: var(--font-sans);
  font-size: 15px;
  line-height: 1.5;
  letter-spacing: 0.009em;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

.ai-grey { color: var(--color-ai); }

/* cloud/src/index.css: on a phone the shared chat pill takes the webapp's phone scale. The mock applies it by frame, not viewport. */
.phone .cloud-chat.text-\[14px\] { font-size: 16px; }

/* Mock page chrome, outside the apps. */
body { background: #ECE7DE; }
.page { max-width: 1440px; margin: 0 auto; padding: 40px 32px 80px; }
.pair { display: grid; grid-template-columns: minmax(0, 1fr); gap: 24px; }
@media (min-width: 1400px) { .pair { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.shot { min-width: 0; }
.shot > .tag { font: 600 11px/1 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: #7A7264; margin: 0 0 8px; }
.frame { position: relative; overflow: hidden; background: var(--color-paper); color: var(--color-ink); border-radius: 10px; box-shadow: 0 0 0 1px rgba(33, 29, 24, .16), 0 10px 30px -12px rgba(33, 29, 24, .35); }
.frame.phone { border-radius: 36px; overflow-y: auto; scrollbar-width: none; }
.center { display: flex; justify-content: center; }
</style>
</head>
<body>
<div class="page">
  <header class="mb-10">
    <h1 class="heading-title">Archive mocks</h1>
    <p class="mt-3 text-[14px] text-mut">Mocks for <a class="text-blue underline" href="../.planning/archive-design.md">docs/.planning/archive-design.md</a> (MTG-21, SYNC-21, SYNC-22), each drawn with the apps' own tokens and class strings, light on the left and dark on the right.</p>
  </header>
  <div id="sections" class="flex flex-col gap-14"></div>
</div>

<script>
// Lucide paths as lucide-react 1.34.0 renders them (web/node_modules).
const PATHS = {
  star: '<path d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z"></path>',
  archiveRestore: '<rect width="20" height="5" x="2" y="3" rx="1"></rect><path d="M4 8v11a2 2 0 0 0 2 2h2"></path><path d="M20 8v11a2 2 0 0 1-2 2h-2"></path><path d="m9 15 3-3 3 3"></path><path d="M12 12v9"></path>',
  archive: '<rect width="20" height="5" x="2" y="3" rx="1"></rect><path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8"></path><path d="M10 12h4"></path>',
  search: '<path d="m21 21-4.34-4.34"></path><circle cx="11" cy="11" r="8"></circle>',
  settings: '<path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"></path><circle cx="12" cy="12" r="3"></circle>',
  plus: '<path d="M5 12h14"></path><path d="M12 5v14"></path>',
  more: '<circle cx="12" cy="12" r="1"></circle><circle cx="19" cy="12" r="1"></circle><circle cx="5" cy="12" r="1"></circle>',
  tag: '<path d="M12.586 2.586A2 2 0 0 0 11.172 2H4a2 2 0 0 0-2 2v7.172a2 2 0 0 0 .586 1.414l8.704 8.704a2.426 2.426 0 0 0 3.42 0l6.58-6.58a2.426 2.426 0 0 0 0-3.42z"></path><circle cx="7.5" cy="7.5" r=".5" fill="currentColor"></circle>',
  trash: '<path d="M10 11v6"></path><path d="M14 11v6"></path><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"></path><path d="M3 6h18"></path><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>',
  link2: '<path d="M9 17H7A5 5 0 0 1 7 7h2"></path><path d="M15 7h2a5 5 0 1 1 0 10h-2"></path><line x1="8" x2="16" y1="12" y2="12"></line>',
  arrowLeft: '<path d="m12 19-7-7 7-7"></path><path d="M19 12H5"></path>',
  hardDrive: '<path d="M10 16h.01"></path><path d="M2.212 11.577a2 2 0 0 0-.212.896V18a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-5.527a2 2 0 0 0-.212-.896L18.55 5.11A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"></path><path d="M21.946 12.013H2.054"></path><path d="M6 16h.01"></path>',
  sparkles: '<path d="M11.017 2.814a1 1 0 0 1 1.966 0l1.051 5.558a2 2 0 0 0 1.594 1.594l5.558 1.051a1 1 0 0 1 0 1.966l-5.558 1.051a2 2 0 0 0-1.594 1.594l-1.051 5.558a1 1 0 0 1-1.966 0l-1.051-5.558a2 2 0 0 0-1.594-1.594l-5.558-1.051a1 1 0 0 1 0-1.966l5.558-1.051a2 2 0 0 0 1.594-1.594z"></path><path d="M20 2v4"></path><path d="M22 4h-4"></path><circle cx="4" cy="20" r="2"></circle>',
};
const icon = (n, size, cls = "") =>
  `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide ${cls}" aria-hidden="true">${PATHS[n]}</svg>`;

// web/src/components/Logo.tsx
const logo = (size) => `<svg viewBox="0 0 44 44" width="${size}" height="${size}" style="flex:none" aria-hidden="true"><circle cx="22" cy="22" r="22" fill="#5B4FC7"></circle><path d="M13 31 C 13 22, 31 25, 31 17 C 31 11, 19 12.5, 19 19" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round"></path><circle cx="19" cy="19" r="1.7" fill="#E07A66"></circle></svg>`;

// web/src/components/Button.tsx
const BASE = "inline-flex items-center justify-center gap-2 rounded-button font-sans transition-colors transition-shadow duration-150 ease-out select-none focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue/40 focus-visible:ring-offset-2 focus-visible:ring-offset-paper disabled:opacity-50 disabled:cursor-not-allowed";
const SIZE = { md: "px-[18px] py-2.5 text-[14px] font-semibold leading-none", sm: "border px-3.5 py-2 text-[12.5px] font-bold leading-normal" };
const VARIANT = {
  primary: "bg-blue border-blue text-white shadow-button-blue hover:opacity-90 active:opacity-100",
  secondary: "bg-card text-ink border border-line hover:bg-paper active:bg-line/60",
  ghost: "bg-transparent border-transparent text-mut hover:text-ink hover:bg-blsoft/50",
};
const btn = (variant = "primary", extra = "", size = "md") => `${BASE} ${SIZE[size]} ${VARIANT[variant]} ${extra}`.trim();

// web/src/components/settings/labelClass.ts
const LABEL = "text-[11px] font-semibold uppercase tracking-[0.06em] text-mut";

// web/src/components/labels/LabelChip.tsx LABEL_COLORS
const TONE = {
  blue: { bg: "var(--color-blsoft)", fg: "var(--color-blue)" },
  matcha: { bg: "var(--color-mtsoft)", fg: "var(--color-matcha)" },
  lilac: { bg: "var(--color-lilacsoft)", fg: "var(--color-lilac)" },
  honey: { bg: "var(--color-honeysoft)", fg: "var(--color-honey)" },
};
const LABELS = {
  clients: { name: "Clients", color: "honey", count: 214 },
  hiring: { name: "Hiring", color: "lilac", count: 87 },
  planning: { name: "Planning", color: "matcha", count: 156 },
};

const chip = (l, size = "sm", removable = false) => {
  const t = TONE[l.color];
  return `<span class="inline-flex items-center gap-1.5 rounded-pill px-2.5 py-1 ${size === "sm" ? "text-[11px]" : "text-[12px]"} font-medium leading-none" style="background:${t.bg};color:${t.fg}">${l.name}${removable ? `<button type="button" class="ml-0.5 leading-none hover:opacity-70">×</button>` : ""}</span>`;
};

/* ---------------- Mac ---------------- */

// web/src/components/library/Sidebar.tsx and SidebarLabelRow.tsx. `sticky top-0 h-screen` becomes h-full inside a frame.
function sidebar(active) {
  const nav = (on) => on ? "bg-blsoft text-blue font-semibold" : "text-ink hover:bg-line/40";
  const row = (l) => `
    <div><div class="relative group/label">
      <a class="flex items-center gap-2 px-3 py-1.5 rounded-button text-[13px] ${nav(false)}">
        <span class="w-[9px] h-[9px] rounded-[3px] shrink-0" style="background:${TONE[l.color].fg}"></span>
        <span class="flex-1 truncate">${l.name}</span>
        <span class="text-[11px] text-mut">${l.count}</span>
        <span class="shrink-0 text-mut hover:text-ink opacity-0 group-hover/label:opacity-100">${icon("more", 14)}</span>
      </a>
    </div></div>`;
  return `
  <aside class="w-[212px] shrink-0 flex flex-col bg-paper border-r border-line h-full">
    <div class="px-5 pt-5 pb-4 flex items-center gap-2">${logo(28)}<span class="heading-wordmark">yogurt</span></div>
    <div class="px-4 pb-3"><button type="button" class="${btn("primary", "w-full")}">${icon("plus", 16)}New meeting</button></div>
    <nav class="px-2 flex flex-col gap-0.5">
      <a class="px-3 py-1.5 rounded-button text-[13px] ${nav(active === "all")}">All meetings</a>
      <a class="px-3 py-1.5 rounded-button text-[13px] flex items-center gap-1.5 ${nav(active === "starred")}">${icon("star", 14, "shrink-0 fill-current")}Starred</a>
      <a class="px-3 py-1.5 rounded-button text-[13px] flex items-center gap-1.5 ${nav(active === "archive")}">${icon("archive", 14, "shrink-0")}Archive</a>
    </nav>
    <div class="px-5 pt-5 pb-1 flex items-center justify-between ${LABEL}">
      <span>Labels</span>
      <div class="flex items-center gap-1">
        <select aria-label="Sort labels" class="text-[10px] text-mut bg-transparent border-none text-right focus:outline-none cursor-pointer"><option>A-Z</option></select>
        <button type="button" aria-label="New label" class="text-mut hover:text-ink disabled:opacity-50">${icon("plus", 12)}</button>
      </div>
    </div>
    <div class="px-2 flex flex-col gap-0.5">${row(LABELS.clients)}${row(LABELS.hiring)}${row(LABELS.planning)}</div>
    <div class="mt-auto px-4 py-4 flex flex-col gap-2">
      <div class="self-start px-2.5 py-1 rounded-pill bg-mtsoft text-ink text-[11px] font-medium">Cloud sync · on</div>
      <a class="flex items-center gap-2 px-2 py-1.5 rounded-button text-[13px] text-ink hover:bg-line/40">${icon("settings", 16)}<span>Settings</span></a>
    </div>
  </aside>`;
}

// web/src/components/library/SearchPill.tsx
const searchPill = () => `
  <div role="search" class="flex items-center gap-2 bg-card border border-line rounded-pill px-4 py-2 text-[13px] text-ink w-[280px] focus-within:ring-2 focus-within:ring-blue/40">
    ${icon("search", 16, "text-mut shrink-0")}
    <input type="text" placeholder="Search notes &amp; transcripts" class="flex-1 bg-transparent outline-none placeholder:text-mut">
  </div>`;

// web/src/components/MeetingMetaPills.tsx
const PILL = "inline-flex items-center gap-1.5 rounded-pill px-2.5 py-1 text-[12px] font-medium leading-none";
const PLABEL = "min-w-0 max-w-[12rem] truncate";
const metaPill = (text) => `<span class="${PILL} bg-card text-mut border border-line">${text}</span>`;
const enginePill = (text) => `<span class="${PILL} bg-mtsoft text-ink relative group/pill">${icon("hardDrive", 12, "shrink-0 text-matcha")}<span class="${PLABEL}">${text}</span></span>`;
const llmPill = (text) => `<span class="${PILL} bg-blsoft text-ink relative group/pill">${icon("sparkles", 12, "shrink-0 text-blue")}<span class="${PLABEL}">${text}</span></span>`;

// web/src/components/library/MeetingCardActions.tsx
const ICON_BUTTON = "px-1.5 py-1 rounded-button focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue/40";
const MENU_ITEM = "block w-full text-left px-3 py-2 text-ink hover:bg-paper";
function cardMenu(view) {
  return `
    <div role="menu" class="absolute right-0 top-full mt-1 bg-card border border-line rounded-card shadow-pop py-1 min-w-[200px] z-10 text-[13px]">
      <button type="button" role="menuitem" class="${MENU_ITEM}">Copy markdown</button>
      <button type="button" role="menuitem" class="${MENU_ITEM}">Reveal in Finder</button>
      <button type="button" role="menuitem" class="block w-full text-left px-3 py-2 text-ink bg-paper">${view === "archive" ? "Unarchive" : "Archive"}</button>
      <button type="button" role="menuitem" class="block w-full text-left px-3 py-2 text-straw hover:bg-paper">Delete</button>
    </div>`;
}

// web/src/components/library/MeetingCard.tsx. `hover` draws the card as the pointer leaves it with its menu open.
function card(m, { selectionActive = false, selected = false, hover = false, menu = null } = {}) {
  const reveal = hover ? "opacity-100" : "opacity-0 group-hover:opacity-100 group-focus-within:opacity-100";
  const right = [
    ...(m.labels || []).map((k) => chip(LABELS[k], "sm")),
    m.stt ? enginePill(m.stt) : "",
    m.llm ? llmPill(m.llm) : "",
  ].join("");
  return `
  <li>
    <a class="group flex items-start justify-between gap-4 px-[18px] py-4 bg-card border ${hover ? "border-grey/60" : "border-line"} rounded-card shadow-card hover:border-grey/60 transition-colors">
      <label class="shrink-0 flex items-center h-[22px] pr-0.5 ${selectionActive ? "opacity-100" : reveal}">
        <input type="checkbox" ${selected ? "checked" : ""} class="w-4 h-4 rounded-[4px] border border-line accent-blue cursor-pointer">
      </label>
      <div class="flex-1 min-w-0">
        <div class="flex items-center gap-1.5 min-w-0">
          <span class="block min-w-0 text-[15px] font-semibold text-ink truncate">${m.title}</span>
          ${m.starred ? icon("star", 12, "shrink-0 text-straw fill-straw") : ""}
        </div>
        <div class="mt-1 flex flex-wrap items-center gap-1.5"><span class="text-[12px] text-mut">${m.caption}</span></div>
      </div>
      <div class="flex items-center gap-1.5 shrink-0">
        ${right}
        <div class="relative shrink-0 flex items-center">
          <button type="button" class="${ICON_BUTTON} ${m.starred ? "text-straw" : `text-mut hover:text-ink ${reveal}`}">${icon("star", 16, m.starred ? "fill-current" : "")}</button>
          <button type="button" class="${ICON_BUTTON} text-mut hover:text-ink ${reveal}">${icon("tag", 16)}</button>
          <button type="button" class="${ICON_BUTTON} ${menu ? "text-ink" : "text-mut hover:text-ink"}">${icon("more", 18)}</button>
          ${menu ? cardMenu(menu) : ""}
        </div>
      </div>
    </a>
  </li>`;
}

// web/src/components/library/DateGroup.tsx
const dateGroups = (groups, opts = () => ({})) => `
  <div class="flex flex-col gap-8">
    ${groups.map((g) => `
      <section>
        <h2 class="${LABEL} mb-2">${g.label}</h2>
        <ul class="flex flex-col gap-2">${g.meetings.map((m) => card(m, opts(m))).join("")}</ul>
      </section>`).join("")}
  </div>`;

// web/src/components/AskPill.tsx at FLOATING, absolute inside the frame instead of fixed to the viewport.
const askPill = (position, kbd = true) => `
  <button type="button" class="${position} h-12 flex items-center justify-between gap-3 px-4 py-2 bg-[var(--color-card)] border border-[var(--color-line)] rounded-full shadow-pop text-left text-[14px] text-[var(--color-mut)] hover:border-[var(--color-blue)] hover:text-[var(--color-ink)] transition-colors z-30">
    <span class="flex-1 truncate">Ask across meetings…</span>

function cloudPills(d, items, value, label) {
  const pill = (on) => `flex-none ${d ? "text-[11px]" : "text-[13px]"} leading-normal font-bold px-[10px] py-[5px] rounded-pill border cursor-pointer font-[inherit] ${on ? "bg-blue border-blue text-white" : "bg-card border-line text-mut"}`;
  // The label dot borrows the Mac sidebar's square swatch (SidebarLabelRow.tsx:99), scaled to the pill.
  const dot = (c) => c ? `<span class="inline-block ${d ? "w-[7px] h-[7px]" : "w-[8px] h-[8px]"} rounded-[2px] mr-[5px] align-[0.5px]" style="background:${TONE[c].fg}"></span>` : "";
  return `
  <div role="group" aria-label="${label}" class="flex gap-[6px] ${d ? "flex-wrap overflow-visible" : "overflow-x-auto [scrollbar-width:none]"}">
    ${items.map((it) => `<button type="button" aria-pressed="${it.id === value}" class="${pill(it.id === value)}">${dot(it.color)}${it.name}</button>`).join("")}
  </div>`;
}

const devicePills = (d, value) => cloudPills(d, [{ id: null, name: "All devices" }, ...DEVICES], value, "Device");
function filterPills(d, device, value) {
  const items = [{ id: "all", name: "All" }];
  if (device) {
    items.push({ id: "starred", name: "Starred" });
    for (const k of ["clients", "hiring", "planning"]) items.push({ id: k, name: LABELS[k].name, color: LABELS[k].color });
  }
  items.push({ id: "archive", name: "Archive" });
  return cloudPills(d, items, value, "Filter");
}

// Shrink each frame to its column so a pair never overflows the page.
function fit() {
  for (const fr of document.querySelectorAll(".frame")) {
    const room = fr.parentElement.clientWidth;
    fr.style.zoom = Math.min(1, room / Number(fr.dataset.w));
  }
}
