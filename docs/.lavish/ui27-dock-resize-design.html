<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dock resize mocks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.11"></script>
<!-- Tokens copied from web/src/index.css. cloud/src/index.css imports the same file, so the webapp shares them. -->
<style type="text/tailwindcss">
@theme {
  --color-paper:   #FBF7EF;  /* app background, hero surfaces             */
  --color-card:    #FFFFFF;  /* cards, surfaces over paper                */
  --color-ink:     #211D18;  /* user notes, headings, primary text        */
  --color-grey:    #A89F90;  /* secondary captions, transcript "Them"     */
  --color-ai:      #7A7264;  /* AI-added text (4.5:1 on paper)            */
  --color-line:    #EBE3D5;  /* borders, dividers                         */
  --color-blue:    #5B4FC7;  /* primary blueberry: buttons, transcript   */
  --color-blsoft:  #ECE9FB;  /* soft blueberry: active-nav, pill bg      */
  --color-straw:   #E07A66;  /* recording indicator, error accent         */
  --color-strsoft: #FBE6E0;  /* soft strawberry: error/warning bg        */
  --color-matcha:  #5E9E73;  /* local-only / privacy / success            */
  --color-mtsoft:  #E7F0E8;  /* soft matcha: local-mode badges           */
  --color-mut:     #8A8174;  /* muted text on cards                       */
  /* Label chip palette (LabelChip.tsx): the three non-brand label colors. */
  --color-lilac:     #8A5BB8;
  --color-lilacsoft: #F3E8FB;
  --color-honey:     #A67C1B;
  --color-honeysoft: #FBF0D6;
  --color-honeyink:  #7A5A0F;  /* honey text that reaches 4.5:1 on white and on honeysoft */
  --color-slate:     #4E5D6B;
  --color-slatesoft: #E8ECF0;

  --font-sans:  "Manrope", "Inter", "DM Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono:  "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;

  --radius-chip:   8px;    /* small chip                                    */
  --radius-button: 12px;   /* buttons, inputs, nav rows                     */
  --radius-card:   16px;   /* cards                                         */
  --radius-panel:  24px;   /* floating panels: chat window, dialogs, dock   */
  --radius-pill:   999px;  /* pills, recording badge                        */

  /* Tailwind copies a shadow's value into its utility class, so dark mode re-points the colors below, not these. */
  --shadow-card:   0 16px 32px -4px var(--shadow-card-color);
  --shadow-pop:    0 12px 16px -4px var(--shadow-pop-color);
  --shadow-window: 0 24px 48px -8px var(--shadow-window-color);
  --shadow-button-blue: 0 8px 16px -6px rgba(91, 79, 199, 0.35);
}

/* The label palette is read from inline styles (LabelChip), which the runtime does not scan, so emit every token. */
:root {
  color-scheme: light;
  --shadow-card-color:   rgba(33, 29, 24, 0.06);
  --shadow-pop-color:    rgba(33, 29, 24, 0.18);
  --shadow-window-color: rgba(33, 29, 24, 0.22);
  --color-lilac:     #8A5BB8;
  --color-lilacsoft: #F3E8FB;
  --color-honey:     #A67C1B;
  --color-honeysoft: #FBF0D6;
  --color-slate:     #4E5D6B;
  --color-slatesoft: #E8ECF0;
}

/* The app stamps data-theme="dark" on <html>. A mock forces dark on its own frame with .force-dark. */
:root[data-theme="dark"], .force-dark {
  color-scheme: dark;
  --color-paper:   #1B1815;
  --color-card:    #26221D;
  --color-ink:     #EDEAE2;
  --color-grey:    #8F877B;
  --color-ai:      #A69D90;
  --color-line:    #3A342C;
  --color-blue:    #7D72DE;
  --color-blsoft:  #2C2846;
  --color-straw:   #E8886F;
  --color-strsoft: #3D2622;
  --color-matcha:  #7FBE8C;
  --color-mtsoft:  #22342A;
  --color-mut:     #9B9285;
  --color-lilac:     #C4A2E8;
  --color-lilacsoft: #33283F;
  --color-honey:     #D9B24E;
  --color-honeysoft: #3A3120;
  --color-honeyink:  #D9B24E;
  --color-slate:     #A9B7C4;
  --color-slatesoft: #2A3138;
  --shadow-card-color:   rgba(0, 0, 0, 0.35);
  --shadow-pop-color:    rgba(0, 0, 0, 0.5);
  --shadow-window-color: rgba(0, 0, 0, 0.6);
}

@utility heading-hero    { @apply font-extrabold tracking-[-0.01em] text-[44px] leading-none text-ink; }
@utility heading-greeting{ @apply font-extrabold tracking-[-0.01em] text-[34px] leading-tight text-ink; }
@utility heading-title   { @apply font-extrabold tracking-[-0.01em] text-[26px] leading-none text-ink; }
@utility heading-state   { @apply font-extrabold tracking-[-0.01em] text-[30px] text-ink; }
@utility heading-section { @apply font-extrabold tracking-[-0.01em] text-[24px] leading-none text-ink; }
@utility heading-wordmark{ @apply font-bold tracking-[-0.01em] text-[20px] leading-none text-ink; }
@utility heading-card    { @apply font-bold tracking-[-0.01em] text-[18px] leading-tight text-ink; }
@utility heading-sm      { @apply font-sans font-bold tracking-[-0.01em] text-[16px] text-ink; }

html, body {
  margin: 0;
  background: var(--color-paper);
  color: var(--color-ink);
  font-family: var(--font-sans);
  font-size: 15px;
  line-height: 1.5;
  letter-spacing: 0.009em;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

.ai-grey { color: var(--color-ai); }

/* cloud/src/index.css: on a phone the shared chat pill takes the webapp's phone scale. The mock applies it by frame, not viewport. */
.phone .cloud-chat.text-\[14px\] { font-size: 16px; }

/* Mock page chrome, outside the apps. */
body { background: #ECE7DE; }
.page { max-width: 1440px; margin: 0 auto; padding: 40px 32px 80px; }
.pair { display: grid; grid-template-columns: minmax(0, 1fr); gap: 24px; }
@media (min-width: 1400px) { .pair { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.shot { min-width: 0; }
.shot > .tag { font: 600 11px/1 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: #7A7264; margin: 0 0 8px; }
.frame { position: relative; overflow: hidden; background: var(--color-paper); color: var(--color-ink); border-radius: 10px; box-shadow: 0 0 0 1px rgba(33, 29, 24, .16), 0 10px 30px -12px rgba(33, 29, 24, .35); }
.frame.phone { border-radius: 36px; overflow-y: auto; scrollbar-width: none; }
.center { display: flex; justify-content: center; }
/* A dot on the dock's Recap tab while it holds bullets the user has not seen. */
.unseen-dot { display: block; width: 8px; height: 8px; border-radius: 999px; background: var(--color-blue); }
.shimmer-line { background: linear-gradient(90deg, var(--color-line) 0%, var(--color-paper) 50%, var(--color-line) 100%); background-size: 200% 100%; animation: shimmer 1.25s linear infinite; border-radius: 6px; }
@keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
/* Resize handle: an 8px hit strip straddling the panel's left border. */
.handle { position: absolute; top: 0; bottom: 0; left: -4px; width: 8px; cursor: col-resize; z-index: 32; touch-action: none; }
.handle::after { content: ""; position: absolute; top: 0; bottom: 0; left: 3px; width: 2px; background: var(--color-blue); opacity: 0; transition: opacity 120ms; }
.handle:hover::after, .handle:focus-visible::after, .handle.on::after { opacity: 1; }
.handle:focus-visible { outline: none; }
.dragging, .dragging * { cursor: col-resize !important; user-select: none !important; }
.ctl { font: 600 12.5px/1 var(--font-sans); padding: 7px 12px; border-radius: 999px; color: #7A7264; background: transparent; border: 1px solid #D9D1C3; }
.ctl.on { background: #211D18; color: #FBF7EF; border-color: #211D18; }
</style>
</head>
<body>
<div class="page">
  <header class="mb-10">
    <h1 class="heading-title">Resizable dock and text size</h1>
    <p class="mt-3 text-[14px] text-mut max-w-[860px]">Mocks for <a class="text-blue underline" href="../.planning/ui27-dock-resize-design.md">docs/.planning/ui27-dock-resize-design.md</a> (UI-27), drawn with the app's own tokens and class strings. Static sections show light on the left and dark on the right. Meeting content is made up.</p>
  </header>
  <div id="sections" class="flex flex-col gap-14"></div>
</div>

<script>
// Lucide paths as lucide-react renders them (web/node_modules).
const PATHS = {
  link2: '<path d="M9 17H7A5 5 0 0 1 7 7h2"></path><path d="M15 7h2a5 5 0 1 1 0 10h-2"></path><line x1="8" x2="16" y1="12" y2="12"></line>',
  mic: '<path d="M12 19v3"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><rect x="9" y="2" width="6" height="13" rx="3"></rect>',
  chevronDown: '<path d="m6 9 6 6 6-6"></path>',
  pause: '<rect x="14" y="4" width="4" height="16" rx="1"></rect><rect x="6" y="4" width="4" height="16" rx="1"></rect>',
  refresh: '<path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"></path><path d="M21 3v5h-5"></path><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"></path><path d="M8 16H3v5"></path>',
  aa: '<path d="m15 16 2.536-7.328a1.02 1.02 1 0 1 1.928 0L22 16"></path><path d="M15.697 14h5.606"></path><path d="m2 16 4.039-9.69a.5.5 0 0 1 .923 0L11 16"></path><path d="M3.304 13h6.392"></path>',
};
const icon = (n, size, cls = "") =>
  `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide ${cls}" aria-hidden="true">${PATHS[n]}</svg>`;

// web/src/components/Button.tsx
const BASE = "inline-flex items-center justify-center gap-2 rounded-button font-sans transition-colors transition-shadow duration-150 ease-out select-none";
const SIZE = { md: "px-[18px] py-2.5 text-[14px] font-semibold leading-none", sm: "border px-3.5 py-2 text-[12.5px] font-bold leading-normal" };
const VARIANT = {
  primary: "bg-blue border-blue text-white shadow-button-blue hover:opacity-90",
  secondary: "bg-card text-ink border border-line hover:bg-paper",
  ghost: "bg-transparent border-transparent text-mut hover:text-ink hover:bg-blsoft/50",
};
const btn = (variant = "primary", extra = "", size = "md") => `${BASE} ${SIZE[size]} ${VARIANT[variant]} ${extra}`.trim();
const LABEL = "text-[11px] font-semibold uppercase tracking-[0.06em] text-mut";
const PILL = "inline-flex items-center gap-1.5 rounded-pill px-2.5 py-1 text-[12px] font-medium leading-none";

/* ---------------- the proposal's numbers ---------------- */

const W_DEFAULT = 330, W_MIN = 320, W_MAX = 600, NOTES_ROOM = 400, GUTTER = 28, MAIN_MAX = 660, NOTES_MIN = 480;
const SIZES = [
  { label: "Small", px: 13 },
  { label: "Default", px: 14 },
  { label: "Large", px: 16 },
  { label: "Extra large", px: 18 },
];
const clampWidth = (w, viewport) => Math.round(Math.max(W_MIN, Math.min(w, W_MAX, viewport - NOTES_ROOM)));
// The wrapper's right padding when the dock is open. "hybrid" clears the panel and its edge tabs until the notes reach
// their minimum, then holds them there and lets the panel overlap. "narrow" never overlaps. "overlay" is today.
const reflowPad = (w, viewport, rule = "hybrid", floor = NOTES_MIN) => {
  if (rule === "overlay") return GUTTER;
  const d = w + GUTTER;
  const clear = Math.min(d, Math.max(GUTTER, 2 * d + MAIN_MAX - viewport));
  return rule === "narrow" ? clear : Math.min(clear, Math.max(GUTTER, viewport - floor));
};

/* ---------------- content ---------------- */

const BULLETS = [
  ["00:42", "Goal: settle the Pro price before the Nov 12 launch review"],
  ["03:10", "Pro conversion is 4.1%, down from 5.0% since the July price change"],
  ["05:55", "Dana proposes $18/month, $180/year"],
  ["08:20", "Finance wants the annual discount capped at 15%"],
  ["11:02", "Open: whether current Pro users keep the old price for 12 months"],
  ["13:47", "Marco owns a churn model for the $18 case, due Friday"],
  ["16:30", "Decided: no free-trial change this quarter"],
];

const TRANSCRIPT = [
  ["them", "00:15:31", "The annual plan is where most of the churn risk sits, so I'd model that first."],
  ["me", "00:15:40", "Agreed. What does finance need from us before the review?"],
  ["them", "00:15:48", "A number for the cap and the grandfathering decision, ideally both."],
  ["me", "00:15:59", "Let's take grandfathering offline, it needs the support team in the room."],
  ["them", "00:16:12", "So if we hold the trial where it is, we keep the funnel numbers comparable."],
  ["me", "00:16:21", "Right, I'd rather not move two things at once."],
  ["them", "00:16:30", "Okay. Trial stays as is this quarter, we revisit in January."],
  ["me", "00:16:44", "Marco, can you get the churn model to us by Friday?"],
  ["them", "00:16:52", "Friday works. I'll use the $18 and $180 numbers."],
];

/* ---------------- dock ---------------- */

// Sizes inside the list are in em so one font-size on the list scales the whole row: text 1em, timestamp 12/14, speaker column 48/14.
const transcriptBody = () => TRANSCRIPT.map(([ch, ts, text]) => `
  <div class="py-2 leading-snug ${ch === "me" ? "text-ink" : "text-grey"}">
    <span class="inline-block font-semibold" style="width:3.43em">${ch === "me" ? "Me" : "Them"}</span>
    <span class="mr-2 font-mono text-grey" style="font-size:0.857em">${ts}</span>
    <span>${text}</span>
  </div>`).join("");

const recapBody = () => BULLETS.map(([ts, text]) => `
  <button type="button" class="group w-full text-left flex gap-3 py-2 rounded-chip -mx-2 px-2 hover:bg-paper">
    <span class="shrink-0 pt-[2px] font-mono text-grey group-hover:text-blue" style="min-width:3.2em;font-size:0.857em">${ts}</span>
    <span class="leading-snug text-ink">${text}</span>
  </button>`).join("") + `<div class="h-2"></div>`;

const recapFooter = `
  <footer class="flex items-center justify-between gap-2 border-t border-line pl-5 pr-3 py-3">
    <span class="text-[12px] text-mut whitespace-nowrap">Updated 1 min ago</span>
    <span class="flex items-center">
      <button type="button" class="${btn("ghost", "whitespace-nowrap px-2.5!", "sm")}">${icon("refresh", 13)}Update now</button>
      <button type="button" class="${btn("ghost", "whitespace-nowrap px-2.5!", "sm")}">${icon("pause", 13)}Pause</button>
    </span>
  </footer>`;

function sizePopover(fs) {
  const cur = SIZES.find((s) => s.px === fs) ?? SIZES[1];
  return `
    <div class="absolute right-3 top-[52px] w-[232px] rounded-card bg-card border border-line shadow-pop p-3 z-[33] animate-[pop-up_260ms_cubic-bezier(0,0,0.2,1)]" role="dialog" aria-label="Text size">
      <p class="${LABEL}">Text size</p>
      <div class="mt-2 flex gap-0.5 rounded-card bg-line/60 p-1" role="radiogroup" aria-label="Text size">
        ${SIZES.map((s, i) => `
          <button type="button" role="radio" aria-checked="${s.px === fs}" aria-label="${s.label}" data-size="${s.px}"
            class="flex-1 h-9 rounded-button font-bold leading-none ${s.px === fs ? "bg-card text-ink shadow-card" : "text-mut hover:text-ink"}"
            style="font-size:${[12, 14, 17, 20][i]}px">A</button>`).join("")}
      </div>
      <p class="mt-2 text-[12px] text-mut">${cur.label} · ${cur.px} px</p>
    </div>`;
}

function dockPanel(view, { w = W_DEFAULT, fs = 14, live = true, popover = false, handle = "", footer = null, floating = false } = {}) {
  const seg = (name, key) => `<button type="button" class="px-3 py-1 rounded-pill text-[12.5px] font-semibold ${view === key ? "bg-blsoft text-blue" : "text-mut hover:text-ink"}">${name}</button>`;
  const foot = footer ?? (view === "recap" ? recapFooter : "");
  return `
    <aside class="absolute right-0 top-0 h-full flex flex-col bg-paper border-l border-line" style="width:${w}px;${floating ? "box-shadow:-24px 0 48px -8px var(--shadow-window-color)" : ""}">
      <div class="handle ${handle === "on" ? "on" : ""}" data-handle tabindex="0" role="separator" aria-orientation="vertical" aria-label="Resize panel"
        aria-valuemin="${W_MIN}" aria-valuemax="${W_MAX}" aria-valuenow="${w}" title="Drag to resize, double-click to reset"></div>
      <header class="flex items-center justify-between border-b border-line" style="padding:18px 12px 14px 14px">
        <div class="flex items-center gap-1">${seg("Recap", "recap")}${seg("Transcript", "transcript")}</div>
        <div class="flex items-center gap-1.5">
          ${live ? `<span class="text-[11px] inline-flex items-center gap-1 text-matcha whitespace-nowrap"><span aria-hidden="true">●</span>connected</span>` : ""}
          <button type="button" data-aa aria-label="Text size" aria-expanded="${popover}"
            class="inline-flex items-center justify-center h-7 w-7 rounded-button ${popover ? "bg-blsoft text-blue" : "text-mut hover:text-ink hover:bg-blsoft/50"}">${icon("aa", 16)}</button>
        </div>
      </header>
      <div class="flex-1 overflow-y-auto" style="padding:${view === "recap" ? "10px" : "12px"} 20px;font-size:${fs}px">${view === "recap" ? recapBody() : transcriptBody()}</div>
      ${foot}
      ${popover ? sizePopover(fs) : ""}
    </aside>`;
}

function edgeTabs({ open, active, w = W_DEFAULT, drag = false }) {
  const right = open ? `${w}px` : "0";
  const tab = (name, top, on, extra = "") => `
    <button type="button" class="absolute flex flex-col items-center justify-center gap-1.5 w-7 text-[12px] font-semibold bg-card ${open && on ? "text-blue" : "text-ink"}"
      style="top:${top}px;right:${right};padding:12px 4px;overflow:hidden;border:1px solid var(--color-line);border-right:none;border-radius:11px 0 0 11px;box-shadow:-8px 8px 22px rgba(40,30,15,.08);z-index:31;${drag ? "" : "transition:right 340ms cubic-bezier(.2,.7,.2,1)"}">
      ${extra}<span style="writing-mode:vertical-rl;white-space:nowrap">${open && on ? "▶" : "◀"} ${name}</span>
    </button>`;
  const wave = `<span class="flex items-end gap-[2px] h-3">${[6, 10, 7, 11].map((h) => `<span class="w-[2px] rounded-full bg-matcha" style="height:${h}px"></span>`).join("")}</span>`;
  return `${tab("Recap", 22, active === "recap")}${tab("Transcript", 112, active === "transcript", wave)}`;
}

/* ---------------- live page ---------------- */

// web/src/routes/Meeting.tsx, header through the notes card.
const liveMain = () => `
  <main class="max-w-[660px] mx-auto px-10 py-12 space-y-6">
    <a class="inline-flex items-center gap-1.5 text-[13px] font-medium text-mut"><span aria-hidden>←</span><span>Library</span><span class="inline-block w-1.5 h-1.5 rounded-full bg-[var(--color-straw)] ml-1 animate-recpulse"></span></a>
    <header class="space-y-2">
      <div class="flex flex-wrap items-center justify-between gap-3">
        <h1 class="heading-title">Q4 pricing sync</h1>
        <div class="flex items-center gap-2 shrink-0">
          <button type="button" class="${btn("secondary", "px-2.5!")}" aria-label="Copy URL">${icon("link2", 16)}</button>
          <button type="button" class="${btn("primary")}">Stop recording</button>
          <button type="button" class="${btn("primary")}">End meeting</button>
        </div>
      </div>
      <div class="flex flex-wrap items-center gap-1.5">
        <span class="${PILL} bg-card text-mut border border-line">Oct 28 · 2:04 PM</span>
        <span class="${PILL} bg-mtsoft text-matcha">Local · whisper</span>
        <span class="${PILL} bg-blsoft text-blue">gpt-4.1-mini</span>
      </div>
      <div class="space-y-1.5 pt-2">
        <label class="flex items-center h-5 ${LABEL}">Microphone</label>
        <div class="flex items-center justify-between rounded-button border border-line bg-card px-3 py-2 text-[13.5px] text-ink">MacBook Pro Microphone ${icon("chevronDown", 14, "text-mut")}</div>
        <button type="button" class="${btn("secondary", "w-full py-3.5 text-[15px]")}">${icon("mic", 18)}Mute mic<kbd class="bg-black/10 text-current text-[11px] font-mono px-1.5 py-0.5 rounded ml-1">M</kbd></button>
      </div>
    </header>
    <section class="rounded-card bg-card p-6 border border-line text-[15px] leading-relaxed">
      <h2 class="text-[20px] font-bold mb-2">Pricing</h2>
      <ul class="list-disc pl-5 space-y-1">
        <li>pro tier → $18? check what finance said about the annual cap before Friday's review</li>
        <li>grandfather current Pro users for 12 months, or only annual ones?</li>
        <li>trial unchanged this quarter</li>
      </ul>
    </section>
  </main>`;

const askPill = `
  <div class="absolute bottom-6 left-1/2 -translate-x-1/2 w-[480px] h-12 flex items-center justify-between gap-3 px-4 py-2 bg-card border border-line rounded-full shadow-pop text-[14px] text-mut z-30">
    <span class="flex-1 truncate">Ask this meeting…</span>
    <span class="inline-flex items-center justify-center h-6 px-2 rounded-chip text-[11px] font-mono text-mut bg-blsoft">⌘K</span>
    <span class="inline-flex items-center justify-center h-7 w-7 rounded-full bg-blue text-white"><svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M6 9.5V2.5M6 2.5L2.5 6M6 2.5L9.5 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
  </div>`;

// vw is the frame's width standing in for the window. reflow=false draws today's overlay for comparison.
function livePage({ vw, view = "transcript", w = W_DEFAULT, fs = 14, popover = false, handle = "", rule = "hybrid", floor = NOTES_MIN, drag = false, open = true }) {
  const f = layoutFacts(vw, w, { open, rule, floor });
  w = f.w;
  const pad = f.pad;
  return `
  <div class="relative h-full overflow-hidden bg-paper" style="padding-right:${pad}px;${drag ? "" : "transition:padding-right 340ms cubic-bezier(.2,.7,.2,1)"}">
    ${liveMain()}
    ${open ? dockPanel(view, { w, fs, popover, handle, floating: f.covered > 0 }) : ""}
    ${edgeTabs({ open, active: view, w, drag })}
  </div>`;
}

// What the notes column does for a window width and a saved dock width, in words for labels and the readout.
function layoutFacts(vw, saved, { open = true, rule = "hybrid", floor = NOTES_MIN } = {}) {
  const w = clampWidth(saved, vw);
  const pad = open ? reflowPad(w, vw, rule, floor) : GUTTER;
  const notes = Math.min(MAIN_MAX, vw - pad);
  const right = (vw - pad + notes) / 2;
  const covered = open ? Math.max(0, Math.round(right - (vw - w - GUTTER))) : 0;
  let what;
  if (!open) what = "dock closed, notes centered";
  else if (covered) what = rule === "overlay" ? `dock covers ${covered} px of the notes` : `notes held at ${notes} px, dock overlaps ${covered} px`;
  else if (rule === "overlay") what = "dock fits beside the notes";
  else if (pad === GUTTER) what = "notes stay put";
  else if (notes === MAIN_MAX) what = `notes shift left ${Math.round((pad - GUTTER) / 2)} px`;
  else what = `notes narrow to ${notes} px`;
  return { w, pad, notes, covered, what, clamped: w !== saved };
}

/* ---------------- interactive prototype ---------------- */

const proto = { w: W_DEFAULT, fs: 14, popover: false, rule: "hybrid", floor: NOTES_MIN, view: "transcript", dark: false, drag: false, open: true, vw: 1440 };
const VW_MIN = 720, VW_MAX = 1680;

function renderProto() {
  const frame = document.getElementById("proto");
  const hadFocus = document.activeElement?.hasAttribute?.("data-handle");
  frame.classList.toggle("force-dark", proto.dark);
  frame.style.width = `${proto.vw}px`;
  frame.innerHTML = livePage({ ...proto, handle: proto.drag ? "on" : "" });
  if (hadFocus) frame.querySelector("[data-handle]")?.focus();
  const size = SIZES.find((s) => s.px === proto.fs);
  const f = layoutFacts(proto.vw, proto.w, proto);
  const dock = !proto.open ? "closed" : f.clamped ? `${f.w} px (saved ${proto.w}, clamped)` : `${f.w} px`;
  document.getElementById("readout").textContent = `Window ${proto.vw} px · Dock ${dock} · Text ${size.label} · Notes ${f.notes} px`;
  document.getElementById("verdict").textContent = f.what;
  document.getElementById("vw").value = proto.vw;
  document.getElementById("floor").value = proto.floor;
  document.getElementById("floorval").textContent = `${proto.floor} px`;
  document.getElementById("floorrow").style.opacity = proto.rule === "hybrid" ? 1 : 0.4;
  for (const b of document.querySelectorAll("[data-ctl]")) {
    const [k, v] = b.dataset.ctl.split(":");
    b.classList.toggle("on", String(proto[k]) === v);
  }
}

function wireProto() {
  const frame = document.getElementById("proto");
  frame.addEventListener("pointerdown", (e) => {
    if (!e.target.closest("[data-handle]")) return;
    e.preventDefault();
    const zoom = Number(document.getElementById("screen").style.zoom) || 1;
    const startX = e.clientX, startW = clampWidth(proto.w, proto.vw);
    proto.drag = true;
    document.body.classList.add("dragging");
    const move = (ev) => {
      proto.w = clampWidth(startW + (startX - ev.clientX) / zoom, proto.vw);
      renderProto();
    };
    const up = () => {
      proto.drag = false;
      document.body.classList.remove("dragging");
      removeEventListener("pointermove", move);
      removeEventListener("pointerup", up);
      renderProto();
    };
    addEventListener("pointermove", move);
    addEventListener("pointerup", up);
  });
  frame.addEventListener("dblclick", (e) => {
    if (e.target.closest("[data-handle]")) { proto.w = W_DEFAULT; renderProto(); }
  });
  frame.addEventListener("keydown", (e) => {
    if (e.target.closest("[data-handle]")) {
      const step = { ArrowLeft: 20, ArrowRight: -20 }[e.key];
      if (step) proto.w = clampWidth(clampWidth(proto.w, proto.vw) + step, proto.vw);
      else if (e.key === "Home") proto.w = W_MIN;
      else if (e.key === "End") proto.w = clampWidth(W_MAX, proto.vw);
      else return;
      e.preventDefault();
      renderProto();
    } else if (e.key === "Escape" && proto.popover) {
      proto.popover = false;
      renderProto();
    }
  });
  frame.addEventListener("click", (e) => {
    const size = e.target.closest("[data-size]");
    if (size) { proto.fs = Number(size.dataset.size); renderProto(); return; }
    if (e.target.closest("[data-aa]")) { proto.popover = !proto.popover; renderProto(); return; }
    if (proto.popover && !e.target.closest("[role=dialog]")) { proto.popover = false; renderProto(); return; }
    const tab = e.target.closest("aside header button");
    if (tab && /Recap|Transcript/.test(tab.textContent)) { proto.view = tab.textContent.trim().toLowerCase(); renderProto(); }
  });
  for (const b of document.querySelectorAll("[data-ctl]")) {
    b.addEventListener("click", () => {
      const [k, v] = b.dataset.ctl.split(":");
      proto[k] = v === "true" ? true : v === "false" ? false : /^\d+$/.test(v) ? Number(v) : v;
      renderProto();
    });
  }
  document.getElementById("floor").addEventListener("input", (e) => {
    proto.floor = Number(e.target.value);
    renderProto();
  });
  document.getElementById("vw").addEventListener("input", (e) => {
    proto.vw = Number(e.target.value);
    renderProto();
  });
}

// Shrink each frame to its column so a pair never overflows the page.
function fit() {
  for (const fr of document.querySelectorAll("[data-w]")) {
    const room = fr.parentElement.clientWidth;
    fr.style.zoom = Math.min(1, room / Number(fr.dataset.w));
  }
}
fit();
addEventListener("resize", fit);
