name: CI

on:
  push:
    branches: [main]
    paths-ignore: &docs-only
      - "**/*.md"
      - "docs/**"
      - LICENSE
  pull_request:
    branches: [main]
    paths-ignore: *docs-only

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  INSTA_UPDATE: no
  MACOSX_DEPLOYMENT_TARGET: "13.0"

jobs:
  rust:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v3
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.4
      - uses: actions/setup-node@v7
        with:
          node-version: 22.14.0
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      # rust-embed's #[folder = "../../web/dist/"] derive requires the
      # folder to exist at compile time (web/dist is gitignored) -- build
      # it before anything that compiles yogurt-server (just lint's clippy,
      # just test-rust).
      - name: build web (rust-embed needs web/dist at compile time)
        run: |
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web build
      - name: lint
        run: just lint
      - name: test
        run: just test-rust
        env:
          YOGURT_MEMORY_KEYSTORE: "1"

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v3
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.4
      - uses: actions/setup-node@v7
        with:
          node-version: 22.14.0
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: install
        run: pnpm --dir web install --frozen-lockfile
      - name: lint-web
        run: just lint-web
      # The Playwright specs mock the backend at the browser layer, so they
      # need no keychain, keys, or audio - only a browser. They were never
      # wired in here, and `library-navigation.spec.ts` silently rotted for
      # it (its meeting fixture lost `labels`, and MeetingCard threw).
      - name: install playwright chromium
        run: pnpm --dir web exec playwright install --with-deps chromium
      - name: test-web
        run: just test-web
      - name: build-web
        run: just build-web
