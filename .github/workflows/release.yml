name: Release

# NOTE ON SIGNING: this pipeline deliberately ships unsigned/ad-hoc-signed
# binaries. Apple Developer Program enrollment (codesign + notarytool +
# stapler) is a paid, human-only step (see 09-01-PLAN.md user_setup) and is
# descoped for the initial release. Homebrew/curl/cargo installs never set
# the com.apple.quarantine xattr, so Gatekeeper (spctl) never evaluates
# these binaries -- notarization only matters for browser-downloaded
# artifacts. Adding codesign + notarize + staple steps back later is a
# self-contained follow-up: insert them between "strip" and "tarball" below
# without touching job structure or `needs:` ordering.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Dry run (skip publishing the GitHub Release)"
        type: boolean
        default: true

env:
  CARGO_TERM_COLOR: always
  MACOSX_DEPLOYMENT_TARGET: "13.0"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96.0"
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.4

      - uses: actions/setup-node@v7
        with:
          node-version: 22.14.0
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      # rust-embed's #[folder = "../../web/dist/"] derive needs web/dist to
      # exist at compile time (the folder is gitignored).
      - name: Build web assets
        run: |
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web build

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} -p yogurt

      - name: Strip binary
        run: strip target/${{ matrix.target }}/release/yogurt

      - name: Package tarball + checksum
        run: |
          tar -czf "yogurt-${{ matrix.target }}.tar.gz" -C target/${{ matrix.target }}/release yogurt
          shasum -a 256 "yogurt-${{ matrix.target }}.tar.gz" > "yogurt-${{ matrix.target }}.tar.gz.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: yogurt-${{ matrix.target }}
          path: |
            yogurt-${{ matrix.target }}.tar.gz
            yogurt-${{ matrix.target }}.tar.gz.sha256

  # The Android companion app. Every APK is signed with the same key, since Android refuses an update signed with another.
  # Secrets (docs/RELEASING.md): YOGURT_ANDROID_KEYSTORE_BASE64 is the base64 of ~/.yogurt/android-release.jks,
  # YOGURT_ANDROID_KEYSTORE_PASSWORD its Keychain password. The runner image ships the Android SDK at $ANDROID_HOME.
  android:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Build the signed APK
        env:
          KEYSTORE_BASE64: ${{ secrets.YOGURT_ANDROID_KEYSTORE_BASE64 }}
          YOGURT_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.YOGURT_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$YOGURT_ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "::error::YOGURT_ANDROID_KEYSTORE_BASE64 and YOGURT_ANDROID_KEYSTORE_PASSWORD must be set (docs/RELEASING.md)"
            exit 1
          fi
          export YOGURT_ANDROID_KEYSTORE="$RUNNER_TEMP/android-release.jks"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$YOGURT_ANDROID_KEYSTORE"
          ./android/gradlew -p android assembleRelease testReleaseUnitTest
          rm "$YOGURT_ANDROID_KEYSTORE"

      # The APK is named after the app's own versionName, which the in-app update check compares.
      - name: Name the APK
        run: |
          OUT=android/app/build/outputs/apk/release
          VERSION=$(jq -r '.elements[0].versionName' "$OUT/output-metadata.json")
          "$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner" verify "$OUT/app-release.apk"
          mkdir dist
          cp "$OUT/app-release.apk" "dist/yogurt-android-$VERSION.apk"
          (cd dist && shasum -a 256 "yogurt-android-$VERSION.apk" > "yogurt-android-$VERSION.apk.sha256")

      - uses: actions/upload-artifact@v7
        with:
          name: yogurt-android
          path: dist/*

  release:
    needs: [build, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: yogurt-*
          path: dist
          merge-multiple: true

      - name: Build SHA256SUMS
        run: cat dist/*.sha256 > dist/SHA256SUMS

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.99-rc-dryrun-$(date +%s)" >> "$GITHUB_OUTPUT"
          fi

      - name: Dry-run summary
        if: github.event_name == 'workflow_dispatch' && inputs.dry-run == true
        run: |
          echo "DRY RUN -- would upload the following to a release tagged ${{ steps.version.outputs.version }}:"
          ls -la dist/

      - name: Create GitHub Release
        if: github.event_name == 'push' || inputs.dry-run == false
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.apk
            dist/SHA256SUMS

  tap:
    needs: release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: yogurt-*
          path: dist
          merge-multiple: true

      - name: Compute per-arch SHA256s
        id: sha
        run: |
          echo "arm_sha=$(shasum -a 256 dist/yogurt-aarch64-apple-darwin.tar.gz | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "x86_sha=$(shasum -a 256 dist/yogurt-x86_64-apple-darwin.tar.gz | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Resolve version
        id: ver
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Checkout tap repo
        uses: actions/checkout@v7
        with:
          repository: jarvisrchen/homebrew-yogurt
          path: tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Rewrite formula
        run: |
          cat > tap/Formula/yogurt.rb <<EOF
          class Yogurt < Formula
            desc "Local-first meeting copilot -- Granola's UX, your machine."
            homepage "https://github.com/jarvisrchen/yogurt"
            version "${{ steps.ver.outputs.version }}"
            license "MIT"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/jarvisrchen/yogurt/releases/download/v${{ steps.ver.outputs.version }}/yogurt-aarch64-apple-darwin.tar.gz"
                sha256 "${{ steps.sha.outputs.arm_sha }}"
              else
                url "https://github.com/jarvisrchen/yogurt/releases/download/v${{ steps.ver.outputs.version }}/yogurt-x86_64-apple-darwin.tar.gz"
                sha256 "${{ steps.sha.outputs.x86_sha }}"
              end
            end

            def install
              bin.install "yogurt"
            end

            test do
              assert_equal "yogurt #{version}", shell_output("#{bin}/yogurt --version").strip
            end
          end
          EOF

      - name: Open tap PR
        working-directory: tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          git config user.name "yogurt-release-bot"
          git config user.email "release-bot@yogurt.local"
          BRANCH="bump-${{ steps.ver.outputs.version }}"
          git checkout -b "$BRANCH"
          git add Formula/yogurt.rb
          git commit -m "yogurt ${{ steps.ver.outputs.version }}"
          git push origin "$BRANCH"
          gh pr create --title "yogurt ${{ steps.ver.outputs.version }}" \
                       --body "Auto-PR from the yogurt release workflow." \
                       --base main --head "$BRANCH"

  # NOTE: crates.io publishing (`cargo publish -p yogurt`) is descoped for
  # now. When it's re-added, it goes here as a `publish` job with
  # `needs: [release, tap]` -- publish-hygiene ordering requires the
  # GitHub Release artifacts AND the tap PR to exist first (see
  # 09-CONTEXT.md D-03/D-10). Never reorder so publish runs before release
  # or tap.
